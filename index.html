<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EthioIntel</title>
    <meta name="description" content="EthioIntel — data-backed policy intelligence for Ethiopian national development. Ten interactive dashboards for government and stakeholders." />
    <meta name="theme-color" content="#080c10" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ethiointel-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"><p class="loading">Loading EthioIntel…</p></div>
    <div id="analyst-root"></div>
    <script src="app.js"></script>
  </body>
</html>
